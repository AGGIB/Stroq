name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Rules bundle verified
        run: pnpm build:rules --check --advisory-perf

      - name: ATLAS denominator verified
        run: pnpm check:atlas

      - name: Run demo
        run: ./examples/demo/run-demo.sh

      - name: Run Cursor demo
        run: ./examples/demo/run-cursor-demo.sh

      - name: Run Codex demo
        run: ./examples/demo/run-codex-demo.sh

      - name: Run Copilot demo
        run: ./examples/demo/run-copilot-demo.sh

      - name: Run OpenClaw demo
        run: ./examples/demo/run-openclaw-demo.sh

      - name: Run Windsurf demo
        run: ./examples/demo/run-windsurf-demo.sh

      - name: Run MCP demo
        run: ./examples/demo/run-mcp-demo.sh

      - name: Attack suite
        run: node packages/cli/dist/index.js attack

      - name: Attack suite — mutation fuzz
        # Baseline of 11 known escapes: the list `attack --fuzz` prints is the
        # specification for the work that closes them one at a time (Part 4). This
        # step fails only once the escape count grows past that baseline, so known
        # gaps stay non-blocking while a new one is still caught. Drop the whole step
        # in the same PR that gets the baseline to 0.
        #
        # `attack --fuzz --json` exits 1 whenever anything escaped, which is the
        # expected case today, so the run itself must not fail the step — but a
        # genuine crash (any exit code other than 0 or 1, or a report that doesn't
        # parse) still must. Exactly one fuzz run: it takes about a minute.
        run: |
          set +e
          node packages/cli/dist/index.js attack --fuzz --json > fuzz-report.json
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            echo "attack --fuzz crashed (exit $status):" >&2
            cat fuzz-report.json >&2
            exit "$status"
          fi
          node -e '
            const fs = require("node:fs");
            const BASELINE = 11;
            const report = JSON.parse(fs.readFileSync("fuzz-report.json", "utf8"));
            const escaped = report.escaped;
            if (!Array.isArray(escaped)) throw new Error("fuzz-report.json has no escaped array");
            for (const v of escaped) console.log(`${v.scenarioId} ${v.mutationId}`);
            console.log(`escaped ${escaped.length} of ${report.variants} variants (baseline ${BASELINE})`);
            if (escaped.length > BASELINE) {
              console.error(`escape count ${escaped.length} exceeds the baseline of ${BASELINE} — a new escape was introduced`);
              process.exit(1);
            }
          '

      - name: Verify npm package contents
        working-directory: packages/cli
        run: npm pack --dry-run
