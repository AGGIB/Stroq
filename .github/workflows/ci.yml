name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Rules bundle verified
        run: pnpm build:rules --check --advisory-perf

      - name: Run demo
        run: ./examples/demo/run-demo.sh

      - name: Run Cursor demo
        run: ./examples/demo/run-cursor-demo.sh

      - name: Run Codex demo
        run: ./examples/demo/run-codex-demo.sh

      - name: Run Copilot demo
        run: ./examples/demo/run-copilot-demo.sh

      - name: Attack suite
        run: node packages/cli/dist/index.js attack

      - name: Verify npm package contents
        working-directory: packages/cli
        run: npm pack --dry-run
