name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI checks code, it never writes to the repository.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Type check
        run: pnpm typecheck

      - name: Test with coverage
        run: pnpm test:coverage

      - name: Build
        run: pnpm build

      - name: Rules bundle verified
        run: pnpm build:rules --check --advisory-perf

      - name: ATLAS denominator verified
        run: pnpm check:atlas

      - name: Bench corpus verified
        run: pnpm check:bench-corpus

      - name: Generated reports current
        run: pnpm check:reports

      - name: Run demo
        run: ./examples/demo/run-demo.sh

      - name: Run Cursor demo
        run: ./examples/demo/run-cursor-demo.sh

      - name: Run Codex demo
        run: ./examples/demo/run-codex-demo.sh

      - name: Run Copilot demo
        run: ./examples/demo/run-copilot-demo.sh

      - name: Run OpenClaw demo
        run: ./examples/demo/run-openclaw-demo.sh

      - name: Run Windsurf demo
        run: ./examples/demo/run-windsurf-demo.sh

      - name: Run MCP demo
        run: ./examples/demo/run-mcp-demo.sh

      - name: Attack suite
        run: node packages/cli/dist/index.js attack

      - name: Attack suite — mutation fuzz
        # Baseline of 0: the mutation corpus has no known escapes left, so this step
        # is a true zero-regression gate, not a ratchet with slack in it — it fails
        # the moment a single semantics-preserving variant gets through, whether that
        # is a fresh escape or an old one that comes back while rule scoping and
        # normalisation keep changing. Baseline used to sit above zero (11, then 5)
        # while the escapes the list `attack --fuzz` prints were being closed one at
        # a time (Part 4); that work is done, so there is no longer a step to drop —
        # keep this baseline at 0.
        #
        # Was 11 until provenance atoms started extracting over decoded variants
        # (`extractAtomsDeep`), which closed the base64/hex/url-encoded escapes on
        # scenarios 02 and 16 — leaving 4 homoglyph-greek and 1 split-across-lines,
        # both since closed too.
        #
        # `attack --fuzz --json` exits 1 whenever anything escaped and 0 otherwise,
        # so with zero known escapes the run itself is now expected to exit 0 — but
        # a genuine crash (any exit code other than 0 or 1, or a report that doesn't
        # parse) still must fail the step. Exactly one fuzz run: it takes about a
        # minute.
        run: |
          set +e
          node packages/cli/dist/index.js attack --fuzz --json > fuzz-report.json
          status=$?
          set -e
          if [ "$status" -ne 0 ] && [ "$status" -ne 1 ]; then
            echo "attack --fuzz crashed (exit $status):" >&2
            cat fuzz-report.json >&2
            exit "$status"
          fi
          node -e '
            const fs = require("node:fs");
            const BASELINE = 0;
            const report = JSON.parse(fs.readFileSync("fuzz-report.json", "utf8"));
            const escaped = report.escaped;
            if (!Array.isArray(escaped)) throw new Error("fuzz-report.json has no escaped array");
            for (const v of escaped) console.log(`${v.scenarioId} ${v.mutationId}`);
            console.log(`escaped ${escaped.length} of ${report.variants} variants (baseline ${BASELINE})`);
            if (escaped.length > BASELINE) {
              console.error(`escape count ${escaped.length} exceeds the baseline of ${BASELINE} — a new escape was introduced`);
              process.exit(1);
            }
          '

      - name: Verify npm package contents
        working-directory: packages/cli
        run: npm pack --dry-run

  # The suite on the other two operating systems Stroq claims; both must pass. The
  # tests that exercise POSIX-only behaviour (mode bits, signals, the bash plugin
  # wrapper, srt) skip on Windows and say why; SECURITY.md lists what that leaves
  # unverified there.
  cross-platform:
    name: suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        run: pnpm test

  # Stroq's own repository through `stroq inspect --sarif`, uploaded to code scanning:
  # it proves GitHub accepts the log the command writes, and a pull request that adds
  # execution this repository would run before anyone approves it shows up as an
  # alert. Exit 1 means findings, which is the upload's job to report, not this step's.
  inspect:
    name: stroq inspect (SARIF)
    runs-on: ubuntu-latest
    # A fork's and Dependabot's pull requests get a read-only token, which cannot upload.
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Inspect this repository
        run: node packages/cli/dist/index.js inspect --sarif . > stroq-inspect.sarif || [ $? -eq 1 ]

      - uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: stroq-inspect.sarif
          category: stroq-inspect
