name: Repository maintainer preview

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
  workflow_run:
    workflows: [CI, CodeQL]
    types: [completed]

# Preview is intentionally read-only. Activating a writer is a separate change.
permissions:
  contents: read
  actions: read
  checks: read
  issues: read
  pull-requests: read

concurrency:
  group: repository-maintainer-preview
  cancel-in-progress: false

jobs:
  preview:
    if: github.repository == 'AGGIB/Stroq'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Always use trusted main, including when the triggering CI ran a fork PR.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node .github/scripts/maintainer.mjs preview
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MAINTAINER_DRY_RUN: 'true'
