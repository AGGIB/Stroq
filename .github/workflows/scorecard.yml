# OpenSSF Scorecard: an automated review of how this repository is built and
# released (pinned actions, token permissions, branch protection, SAST, …).
# Results are published to scorecard.dev, which serves the README badge, and
# uploaded to GitHub code scanning.
#
# `publish_results: true` only works while this workflow keeps the shape the
# Scorecard API verifies: one job, these steps, no top-level env or defaults.
name: Scorecard

on:
  workflow_dispatch:
  # So a change to branch protection is re-scored straight away.
  branch_protection_rule:
  schedule:
    - cron: '17 3 * * 1'
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      # Upload the SARIF to code scanning.
      security-events: write
      # Sign the published results.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: results.sarif
