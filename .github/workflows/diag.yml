name: Diagnostics (temporary)

# Runs the tests the way ci.yml does and keeps the whole output, which the jobs of ci.yml lose on Linux and macOS
# when they fail. Remove this file once the cause is found.
on:
  pull_request:
    paths:
      - .github/workflows/diag.yml

permissions:
  contents: read

jobs:
  diag:
    name: diag (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 24
            command: pnpm test:coverage
          - os: macos-latest
            node: 24
            command: pnpm test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the tests and keep the output
        shell: bash
        run: |
          set +e
          ${{ matrix.command }} > "$RUNNER_TEMP/vitest-out.txt" 2>&1
          echo "exit=$?" >> "$RUNNER_TEMP/vitest-out.txt"
          ps -eo pid,ppid,stat,etime,command | grep -E "node|sleep|sh " | grep -v grep | head -40 > "$RUNNER_TEMP/processes.txt"
          python3 "$GITHUB_WORKSPACE/.github/scripts/diag-annotate.py"
          exit 0

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: vitest-out-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/vitest-out.txt
            ${{ runner.temp }}/processes.txt
