name: Diagnostics (temporary)

# Runs the tests the way ci.yml does, in parts, and keeps their output as annotations, which survive when the log
# of a job does not. Remove this file once the cause is found.
on:
  pull_request:
    paths:
      - .github/workflows/diag.yml

permissions:
  contents: read

jobs:
  diag:
    name: diag (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: shard-5
            command: pnpm exec vitest run --shard=5/8
          - name: all36
            command: pnpm exec vitest run packages/cli/test/adapters/antigravity.test.ts packages/cli/test/adapters/codex.test.ts packages/cli/test/adapters/cursor-file-edit.test.ts packages/cli/test/adapters/windsurf-input.test.ts packages/cli/test/bench/command.test.ts packages/cli/test/commands/cursor-hooks.test.ts packages/cli/test/commands/hook-openclaw.e2e.test.ts packages/cli/test/commands/hook-windsurf.e2e.test.ts packages/cli/test/commands/hook.e2e.test.ts packages/cli/test/commands/hook.test.ts packages/cli/test/commands/init-agent.cli.test.ts packages/cli/test/commands/init-flow-review.test.ts packages/cli/test/commands/init-flow-round5.test.ts packages/cli/test/commands/init-selfcheck.test.ts packages/cli/test/commands/inspect.test.ts packages/cli/test/commands/install-record.test.ts packages/cli/test/commands/log-verify.test.ts packages/cli/test/commands/mcp-config.test.ts packages/cli/test/commands/run.test.ts packages/cli/test/commands/trust.test.ts packages/cli/test/commands/why.test.ts packages/cli/test/exposure/probe.test.ts packages/cli/test/mcp/framing.test.ts packages/cli/test/sent/cursor-store.test.ts packages/cli/test/ui/cleanup.test.ts packages/cli/test/version.test.ts packages/core/test/actions/heredoc-differential.test.ts packages/core/test/actions/pipeline-not-sequence.test.ts packages/core/test/actions/review-2026-10-01.test.ts packages/core/test/actions/review-round6.test.ts packages/core/test/actions/shell-input-differential.test.ts packages/core/test/cloak-detector.test.ts packages/core/test/cloak-prose-names.test.ts packages/core/test/secrets/canary-files.test.ts site/test/docs-page.test.ts site/test/install-count.test.ts
          - name: h1
            command: pnpm exec vitest run packages/cli/test/adapters/antigravity.test.ts packages/cli/test/adapters/codex.test.ts packages/cli/test/adapters/cursor-file-edit.test.ts packages/cli/test/adapters/windsurf-input.test.ts packages/cli/test/bench/command.test.ts packages/cli/test/commands/cursor-hooks.test.ts packages/cli/test/commands/hook-openclaw.e2e.test.ts packages/cli/test/commands/hook-windsurf.e2e.test.ts packages/cli/test/commands/hook.e2e.test.ts packages/cli/test/commands/hook.test.ts packages/cli/test/commands/init-agent.cli.test.ts packages/cli/test/commands/init-flow-review.test.ts packages/cli/test/commands/init-flow-round5.test.ts packages/cli/test/commands/init-selfcheck.test.ts packages/cli/test/commands/inspect.test.ts packages/cli/test/commands/install-record.test.ts packages/cli/test/commands/log-verify.test.ts packages/cli/test/commands/mcp-config.test.ts
          - name: h2
            command: pnpm exec vitest run packages/cli/test/commands/run.test.ts packages/cli/test/commands/trust.test.ts packages/cli/test/commands/why.test.ts packages/cli/test/exposure/probe.test.ts packages/cli/test/mcp/framing.test.ts packages/cli/test/sent/cursor-store.test.ts packages/cli/test/ui/cleanup.test.ts packages/cli/test/version.test.ts packages/core/test/actions/heredoc-differential.test.ts packages/core/test/actions/pipeline-not-sequence.test.ts packages/core/test/actions/review-2026-10-01.test.ts packages/core/test/actions/review-round6.test.ts packages/core/test/actions/shell-input-differential.test.ts packages/core/test/cloak-detector.test.ts packages/core/test/cloak-prose-names.test.ts packages/core/test/secrets/canary-files.test.ts site/test/docs-page.test.ts site/test/install-count.test.ts
          - name: one-00
            command: pnpm exec vitest run packages/cli/test/adapters/antigravity.test.ts
          - name: one-01
            command: pnpm exec vitest run packages/cli/test/adapters/codex.test.ts
          - name: one-02
            command: pnpm exec vitest run packages/cli/test/adapters/cursor-file-edit.test.ts
          - name: one-03
            command: pnpm exec vitest run packages/cli/test/adapters/windsurf-input.test.ts
          - name: one-04
            command: pnpm exec vitest run packages/cli/test/bench/command.test.ts
          - name: one-05
            command: pnpm exec vitest run packages/cli/test/commands/cursor-hooks.test.ts
          - name: one-06
            command: pnpm exec vitest run packages/cli/test/commands/hook-openclaw.e2e.test.ts
          - name: one-07
            command: pnpm exec vitest run packages/cli/test/commands/hook-windsurf.e2e.test.ts
          - name: one-08
            command: pnpm exec vitest run packages/cli/test/commands/hook.e2e.test.ts
          - name: one-09
            command: pnpm exec vitest run packages/cli/test/commands/hook.test.ts
          - name: one-10
            command: pnpm exec vitest run packages/cli/test/commands/init-agent.cli.test.ts
          - name: one-11
            command: pnpm exec vitest run packages/cli/test/commands/init-flow-review.test.ts
          - name: one-12
            command: pnpm exec vitest run packages/cli/test/commands/init-flow-round5.test.ts
          - name: one-13
            command: pnpm exec vitest run packages/cli/test/commands/init-selfcheck.test.ts
          - name: one-14
            command: pnpm exec vitest run packages/cli/test/commands/inspect.test.ts
          - name: one-15
            command: pnpm exec vitest run packages/cli/test/commands/install-record.test.ts
          - name: one-16
            command: pnpm exec vitest run packages/cli/test/commands/log-verify.test.ts
          - name: one-17
            command: pnpm exec vitest run packages/cli/test/commands/mcp-config.test.ts
          - name: one-18
            command: pnpm exec vitest run packages/cli/test/commands/run.test.ts
          - name: one-19
            command: pnpm exec vitest run packages/cli/test/commands/trust.test.ts
          - name: one-20
            command: pnpm exec vitest run packages/cli/test/commands/why.test.ts
          - name: one-21
            command: pnpm exec vitest run packages/cli/test/exposure/probe.test.ts
          - name: one-22
            command: pnpm exec vitest run packages/cli/test/mcp/framing.test.ts
          - name: one-23
            command: pnpm exec vitest run packages/cli/test/sent/cursor-store.test.ts
          - name: one-24
            command: pnpm exec vitest run packages/cli/test/ui/cleanup.test.ts
          - name: one-25
            command: pnpm exec vitest run packages/cli/test/version.test.ts
          - name: one-26
            command: pnpm exec vitest run packages/core/test/actions/heredoc-differential.test.ts
          - name: one-27
            command: pnpm exec vitest run packages/core/test/actions/pipeline-not-sequence.test.ts
          - name: one-28
            command: pnpm exec vitest run packages/core/test/actions/review-2026-10-01.test.ts
          - name: one-29
            command: pnpm exec vitest run packages/core/test/actions/review-round6.test.ts
          - name: one-30
            command: pnpm exec vitest run packages/core/test/actions/shell-input-differential.test.ts
          - name: one-31
            command: pnpm exec vitest run packages/core/test/cloak-detector.test.ts
          - name: one-32
            command: pnpm exec vitest run packages/core/test/cloak-prose-names.test.ts
          - name: one-33
            command: pnpm exec vitest run packages/core/test/secrets/canary-files.test.ts
          - name: one-34
            command: pnpm exec vitest run site/test/docs-page.test.ts
          - name: one-35
            command: pnpm exec vitest run site/test/install-count.test.ts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the tests and keep the output
        shell: bash
        run: |
          set +e
          ${{ matrix.command }} > "$RUNNER_TEMP/vitest-out.txt" 2>&1
          echo "exit=$?" >> "$RUNNER_TEMP/vitest-out.txt"
          ps -eo pid,ppid,stat,etime,command | grep -E "node|sleep|sh " | grep -v grep | head -40 > "$RUNNER_TEMP/processes.txt"
          python3 "$GITHUB_WORKSPACE/.github/scripts/diag-annotate.py"
          exit 0

      - name: Finished
        run: echo finished
