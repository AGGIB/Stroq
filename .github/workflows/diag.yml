      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run the tests and keep the output
        shell: bash
        run: |
          set +e
          ${{ matrix.command }} > "$RUNNER_TEMP/vitest-out.txt" 2>&1
          echo "exit=$?" >> "$RUNNER_TEMP/vitest-out.txt"
          ps -eo pid,ppid,stat,etime,command | grep -E "node|sleep|sh " | grep -v grep | head -40 > "$RUNNER_TEMP/processes.txt"
          python3 "$GITHUB_WORKSPACE/.github/scripts/diag-annotate.py"
          exit 0

      - name: Finished
        run: echo finished
