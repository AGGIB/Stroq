name: Bug report
description: Something is broken — not a missed detection and not a security bypass
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. If Stroq flagged something benign, use the
        **False positive** template instead. If a documented protection was
        silently bypassed, please use the private security advisory process in
        [SECURITY.md](../../SECURITY.md) instead of a public issue.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear, concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands run, the hook event JSON, or a minimal example.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: stroq-version
    attributes:
      label: Stroq version
      description: See package.json, or run `npm ls @stroq/cli`.
      placeholder: '0.1.0'
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      placeholder: 'output of `node --version`'
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: 'e.g. macOS 15, Ubuntu 24.04'
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output
      description: Output of `stroq doctor` and/or `stroq log`, if relevant.
      render: shell
