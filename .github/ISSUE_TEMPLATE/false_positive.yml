name: False positive
description: Stroq flagged, warned on, or blocked something benign
title: '[False positive]: '
labels: ['false-positive']
body:
  - type: markdown
    attributes:
      value: |
        A false positive is treated as a bug in this project. The more
        precisely you can reproduce it, the faster it gets fixed.
  - type: textarea
    id: content
    attributes:
      label: The benign command or content
      description: >
        The command that was denied or asked, or the part of the file or tool
        output that was flagged — the smallest piece that still triggers it.
        Remove anything private first: secrets, internal hostnames, customer
        data. The words that matched matter more than the rest, so a trimmed
        excerpt is fine; if you cannot share any of it, describe it instead.
      render: text
    validations:
      required: false
  - type: textarea
    id: decision
    attributes:
      label: Rule id(s) and decision line
      description: >
        The rule id(s) involved — `stroq why` prints them — and the relevant
        line(s) from `stroq log`, or the reason the agent showed you.
      render: shell
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent and version
      placeholder: 'e.g. Claude Code 2.1.226'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened instead, and why you believe this content or command is benign.
    validations:
      required: true
