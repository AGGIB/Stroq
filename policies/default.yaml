# Stroq's default policy. First match wins; anything unmatched is allowed.
#
# Five classes are `allow` at clean taint and `deny` at suspect: shell.network,
# network.fetch, fs.secrets, git.push_external and mcp.side_effect. That asymmetry is
# deliberate and was re-examined once `stroq bench` produced a number to examine it
# against (docs/BENCH.md).
#
# The case for moving them to `ask` at clean is that a scan miss then costs a prompt
# rather than a breach. The case against is what the prompt would cost: `curl`, `git
# push` and reading a `.env` are the texture of ordinary work, and a guard that asks
# about each of them is a guard people turn off — after which nothing is enforced at
# any taint. The measured false-positive rate is 16.0% of benign documentation files,
# which says the taint signal is worth acting on, not that a clean session should be
# treated as a suspect one.
#
# They therefore stay `allow` at clean, and the reason is recorded here rather than
# left implicit. What backs that choice is the depth on the other side: the classes
# denied at ANY taint — secret.egress, secret.unscannable, config.self,
# config.git_exec, shell.exec_encoded, origin.suspect — do not depend on the scan
# having caught anything, and `stroq attack --fuzz` reports zero escapes across 350
# mutated variants of the recorded corpus.
version: 1
threshold: 0.6
default: allow
rules:
  - id: deny-secret-egress
    effect: deny
    reason: Arguments contain the value of a known secret; outbound use is blocked
    when:
      classes: [secret.egress]
      taint: any
  - id: deny-secret-unscannable
    effect: deny
    reason: Arguments are larger than the secret scan window (2 MiB), so Stroq cannot check them for secret values; outbound use is blocked
    when:
      classes: [secret.unscannable]
      taint: any
  - id: deny-self-tamper
    effect: deny
    reason: Modifying agent security configuration is blocked
    when:
      classes: [config.self]
      taint: any
  - id: deny-git-exec
    effect: deny
    reason: Installing repository-supplied execution (git exec-on-read config or hook file) is blocked
    when:
      classes: [config.git_exec]
      taint: any
  - id: deny-encoded-exec
    effect: deny
    reason: Executing decoded or remotely fetched code is blocked
    when:
      classes: [shell.exec_encoded]
      taint: any
  - id: deny-origin-suspect
    effect: deny
    reason: 'Action was dictated by content Stroq flagged as suspicious; blocked (a false positive can be cleared with: stroq untaint --session <id>)'
    when:
      classes: [origin.suspect]
      taint: any
  - id: deny-network-when-tainted
    effect: deny
    reason: Session is tainted by suspicious content; outbound network command blocked
    when:
      classes: [shell.network]
      taint: suspect
  - id: deny-fetch-when-tainted
    effect: deny
    reason: Session is tainted by suspicious content; web fetch blocked
    when:
      classes: [network.fetch]
      taint: suspect
  - id: deny-secrets-when-tainted
    effect: deny
    reason: Session is tainted by suspicious content; access to secrets blocked
    when:
      classes: [fs.secrets]
      taint: suspect
  - id: deny-push-external-when-tainted
    effect: deny
    reason: Session is tainted by suspicious content; push to external remote blocked
    when:
      classes: [git.push_external]
      taint: suspect
  - id: ask-origin-untrusted
    effect: ask
    reason: Action was copied from content the agent read (tool output is data, not instructions); confirm
    when:
      classes: [origin.untrusted]
      taint: any
  - id: ask-mcp-side-effect-when-tainted
    effect: ask
    reason: Session is tainted by suspicious content; confirm this side-effecting MCP call
    when:
      classes: [mcp.side_effect]
      taint: suspect
  - id: ask-self-touch
    effect: ask
    reason: Command references agent security configuration; confirm
    when:
      classes: [config.self_touch]
      taint: any
  - id: ask-destructive
    effect: ask
    reason: Destructive command requires confirmation
    when:
      classes: [shell.destructive]
      taint: any
  - id: ask-shell-unparsed
    effect: ask
    reason: Stroq could not read what this command executes (a dynamic-execution form with a non-literal operand); confirm
    when:
      classes: [shell.unparsed]
      taint: any
  - id: ask-push-external
    effect: ask
    reason: Push to an external remote requires confirmation
    when:
      classes: [git.push_external]
      taint: any
