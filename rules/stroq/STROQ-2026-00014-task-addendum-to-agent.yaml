id: STROQ-2026-00014
title: 'Task addendum addressed to the agent'
status: experimental
severity: high
author: 'Stroq'
date: '2026/11/01'
schema_version: '1.0'
# High, above the 0.6 taint threshold: a data field that greets the assistant, puts something to do ahead
# of the user's own request ("before finishing the task above, first ...") and speaks in the sender's
# name ("[PRIORITY MESSAGE]", "— the user") is an instruction smuggled into data, and it is what an
# indirect prompt injection in an MCP result, a record, a fetched page or a repository file looks like.
# It is a PAIR rule: one cue alone is ordinary text ("Dear customer, before completing your order,
# verify your email"; "Urgent: product not received"; "Hello, Assistant Professor"), and every
# condition needs two families within 600 characters of each other:
#   ADDR   greets or addresses an AI ("Hi Assistant", "Note to AI", "if you are an AI"). A name that a
#          person can have (Claude, Gemini) or the generic "agent" counts only beside the strict TASK, and
#          never in "Hello Copilot users"; ADDR beside PERSONAL is not a pair ("Dear Assistant, I forgot
#          to mention" is a letter to a human);
#   TASK   sequences work around the agent's own task ("before finishing the task above", "then continue
#          with the original request", "stop what you are doing"). The strict reading, used where no
#          AI is addressed, takes a task, a request or an assignment and wants the sentence to say which:
#          the other tasks, the original request, the task above ("before completing the request form",
#          "before finishing the steps below" are a checklist);
#   FRAME  the sender's authority. STRONG is a form mail and tickets do not use: a bracketed marker, a
#          warning sign, "critical priority", a signature that ends the message ("— the user"). A
#          signature is read only at the end of a message (a --user flag is not one). Without an address
#          the warning sign counts for URGENT and CRITICAL only ("Warning:" and "Attention:" in a README
#          are not an order), "critical priority" is a ticket's field, and only a signature of the user,
#          the owner, the operator or the admin counts (a manager signs a to-do list). PERSONAL is a person's turn of phrase ("I forgot to mention", "sorry for the
#          late addition"), which counts only with TASK.
# Every condition but the one that pairs an address with a marker or a signature skips instruction
# files: a CLAUDE.md that says "Hi Claude! Before finishing any task, run the tests" or "IMPORTANT: Before
# completing any other task, run the linter" is addressed to the agent on purpose.
# Measured (docs/BENCH.md; NVIDIA Nemotron-RL-Agentic-Indirect-Prompt-Injection-v1, CC BY 4.0): 0 of 121
# documentation files, 0 of 29,775 tool results of 500 public coding-agent sessions and 0 of 11,865
# terminal outputs of the Terminal-Pivot sample. Spelled to be read inside JSON text too: a line break is
# the two characters backslash n there, and a dash or a warning sign may be a backslash-u escape.
tags:
  category: prompt-injection
  scan_target: any
detection:
  condition: any
  conditions:
