# ---------------------------------------------------------------------------------------------
# Local conditions (2026-10-28). An entry's `local:` keeps a condition's broad pattern for text
# somebody else wrote (tool descriptions, MCP results, fetched pages and fetched command output,
# dependency folders, instruction files) and reads a narrower pattern, or none (`off`), on the
# developer's own files and program output (`repo_content`, `command_output`).
#
# Measured on 500 public coding-agent sessions with real execution (NVIDIA SWE-Hero OpenHands
# trajectories, CC-BY-4.0, 191 repositories, 28,347 tool calls): with every rule on every surface,
# 386 tool results were `suspect`, every one a false alarm, and a suspect result later denies the
# session's network, secret and origin-suspect actions. Each narrower pattern below still matches
# every true_positive of its rule on every surface (packages/core/test/rules/surface-recall.test.ts):
# an instruction planted in a cloned repository arrives by `Read README.md`, `cat` or `git log`, so
# the rule's own attacks must fire there too. Scoping whole rules away from local text was tried
# first and reverted for exactly that reason.
#
# Two more forms (2026-10-28), for conditions whose broad pattern misfired on text somebody else
# wrote as well (a teammate's pull request read with `gh`, a server's output over `ssh`): `to:`
# narrows the condition on every surface, and `surfaces:` keeps it only on the surfaces it names,
# for a pattern that is evidence only there (a credential file's name in a tool's description).
# The same test holds every true_positive of the rule to every surface.
# ---------------------------------------------------------------------------------------------

ATR-2026-02019:
  reason: >-
    Condition 0 matched "run the following python code", which is how a library tells a person
    what to do: 69 of 386 false alarms in 500 public agent sessions were one warning Modin
    prints in command output ("…run the following python code before doing dataframe
    operations"). On local text the phrase needs the colon that introduces the code, as in all
    three true_positives; the role-assignment forms are unchanged.
  conditions:
    - index: 0
      from: |-
        (?i)\b(?:you(?:'re| are)|act\s+as)\s+(?:a\s+)?python\s+(?:interpreter|compiler|printer)\b|\brun\s+the\s+following\s+python\s+code\b|\bevaluate\s+the\s+following\s+print\s+statement\b
      local: |-
        (?i)\b(?:you(?:'re| are)|act\s+as)\s+(?:a\s+)?python\s+(?:interpreter|compiler|printer)\b|\brun\s+the\s+following\s+python\s+code\s*:|\bevaluate\s+the\s+following\s+print\s+statement\b

